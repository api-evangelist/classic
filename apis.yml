aid: classic
name: Classic
description: >-
  Classic (a.k.a. "OG") is the legacy ShapeShift crypto swap interface at
  classic.shapeshift.com, now redirecting to og.shapeshift.com. ShapeShift is a
  self-custody, multichain crypto platform and DEX aggregator. Its Public API
  (api.shapeshift.com) exposes supported assets and chains (identified with
  CAIP-19/CAIP-2), indicative swap rates and executable swap quotes, swap-status
  tracking, and an affiliate/partner program authenticated with Sign-In With
  Ethereum (EIP-4361, returning a JWT bearer token). Surfaced as a portfolio
  company of Pantera Capital and enriched into the API Evangelist network.
