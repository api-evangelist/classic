notes: >-
  First-party ShapeShift (@shapeshiftoss) TypeScript libraries published to npm.
  These are the official client/SDK stack behind the ShapeShift app and the
  ShapeShift Public API surface (CAIP asset identifiers, the unchained multichain
  client, hardware-wallet integration, and shared types). No dedicated generated
  client is published for the api.shapeshift.com Public API; these are the
  official libraries developers use against the ShapeShift stack.
